name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.5)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Desktop builds (Windows, macOS, Linux)
  # ============================================
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            arch: aarch64
            os: macos
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            arch: x86_64
            os: macos
          - platform: ubuntu-22.04
            args: ''
            arch: x86_64
            os: linux
          - platform: windows-latest
            args: ''
            arch: x86_64
            os: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libfuse2: linuxdeploy-*.AppImage 本身是 AppImage，跑它需要 FUSE
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      # AppImage 打包要现下载 AppRun / linuxdeploy（tauri-apps/binary-releases），
      # 源站偶发超时会让整个发版挂掉（上游为此关过 AppImage 目标）。
      # 缓存 ~/.cache/tauri 后只有首次需要下载。
      - name: Cache Tauri bundler tools
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v5
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-tools-linux-v1

      - run: npm ci

      # tauri-action 自动执行 beforeBuildCommand (npm run build) + cargo build
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          # 无 FUSE 环境下直接解包运行 linuxdeploy / appimagetool（CI 容器常无 /dev/fuse）
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          args: ${{ matrix.args }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          BUNDLE_DIR="src-tauri/target/release/bundle"
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            BUNDLE_DIR="src-tauri/target/${{ matrix.arch }}-apple-darwin/release/bundle"
          fi

          if [[ "${{ matrix.os }}" == "windows" ]]; then
            find "$BUNDLE_DIR/nsis" -name "*.exe" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          elif [[ "${{ matrix.os }}" == "macos" ]]; then
            find "$BUNDLE_DIR/dmg" -name "*.dmg" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          elif [[ "${{ matrix.os }}" == "linux" ]]; then
            find "$BUNDLE_DIR/deb" -name "*.deb" -exec cp {} release-artifacts/ \; 2>/dev/null || true
            find "$BUNDLE_DIR/appimage" -name "*.AppImage" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          fi

          echo "Artifacts:"
          ls -R release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts
          if-no-files-found: warn
          retention-days: 1

  # ============================================
  # Android builds (arm64 + armv7 并行)
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            label: arm64
          - target: armv7
            rust_target: armv7-linux-androideabi
            label: armv7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # android-actions/setup-android 的默认 packages 是 "tools platform-tools"，
      # 其中 legacy `tools` 包已被 Google 从 SDK 仓库移除，安装会以
      # "Failed to find package 'tools'" 失败（2026-09 发 v0.6.46 时实测，v4 默认值同样如此）。
      # 只装 platform-tools：sdkmanager 本身由 cmdline-tools 提供，NDK 在下一步单独安装。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - run: sdkmanager "ndk;29.0.14206865"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-${{ matrix.target }}

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.gradle
          key: gradle-${{ matrix.target }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: npm ci

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          : "${ANDROID_KEY_BASE64:?Missing ANDROID_KEY_BASE64 secret}"
          umask 077
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/opencodeui-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/opencodeui-release.p12" >> "$GITHUB_ENV"

      - name: Build and sign APK
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)"
          npm run android:build -- --target "$ANDROID_TARGET"
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' -type f)
          if [[ ${#APKS[@]} -ne 1 ]]; then
            echo "Expected one release APK, found ${#APKS[@]}" >&2
            exit 1
          fi
          APK_PATH="${APKS[0]}"
          "$BT/apksigner" verify --verbose --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/apk-certificate.txt"
          EXPECTED=$(tr -d '\r\n' < src-tauri/gen/android/release-signing.sha256)
          SIGNERS=$(sed -n 's/^Number of signers: //p' "$RUNNER_TEMP/apk-certificate.txt")
          ACTUAL=$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer:) certificate SHA-256 digest: ([[:xdigit:]]{64})$/\2/p' "$RUNNER_TEMP/apk-certificate.txt" | tr '[:upper:]' '[:lower:]' | sort -u)
          if [[ "$SIGNERS" != "1" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "APK signing certificate does not match this fork's release key" >&2
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/OpenCodeUI-${RELEASE_VERSION}-android-${ANDROID_LABEL}.apk"
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_TARGET: ${{ matrix.target }}
          ANDROID_LABEL: ${{ matrix.label }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-android-${{ matrix.label }}
          path: release-artifacts/*
          retention-days: 1

  # ============================================
  # Publish Release
  # ============================================
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-desktop, build-android]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Display artifacts
        run: ls -R artifacts

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          BODY=$(sed -n "/^## \[${TAG}\]/,/^## \[/{ /^## \[${TAG}\]/d; /^## \[/d; p; }" CHANGELOG.md)
          BODY=$(echo "$BODY" | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba;}')
          if [ -z "$BODY" ]; then
            BODY="No changelog entry found for ${TAG}."
          fi
          echo "$BODY" > /tmp/release-body.md
          printf '\n---\n\n**Desktop:** Windows (.exe), macOS (.dmg), Linux (.deb, .AppImage)\n**Mobile:** Android (.apk) — arm64, armeabi-v7a\n' >> /tmp/release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: "OpenCodeUI ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          body_path: /tmp/release-body.md
          files: artifacts/*
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'canary') || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'alpha') || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
