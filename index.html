<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/opencode.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>OpenCode</title>

    <!-- 安卓 WebView 整页重载后，于首绘前同步恢复状态栏安全区高度（值由 MainActivity 注入时写入 localStorage），避免布局先上移再被拖回 -->
    <script>
      try {
        var cachedSafeAreaTop = localStorage.getItem('__opencode_safe_area_top')
        if (cachedSafeAreaTop) document.documentElement.style.setProperty('--safe-area-inset-top', cachedSafeAreaTop)
      } catch (e) {}
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#262524" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenCode" />
    <link rel="apple-touch-icon" href="/opencode.svg" />
  </head>
  <body>
    <!-- Decorum needs a stable host before React commits; React moves this into the desktop titlebar. -->
    <div data-tauri-decorum-tb style="display: none"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
